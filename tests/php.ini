[PHP]
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = Off
html_errors = Off
memory_limit = 256M
max_execution_time = 30
default_charset = "UTF-8"
date.timezone = "Europe/Prague"

[date]
date.timezone = "Europe/Prague"

[mbstring]
mbstring.internal_encoding = "UTF-8" 