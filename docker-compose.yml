name: NexusMap

services:
  db:
    container_name: NexusMapDb
    image: mariadb:10.5.8
    env_file:
      - ./config/mysql.env
    environment:
      - MYSQL_ROOT_HOST=%
      - MYSQL_ROOT_PASSWORD=docker
    ports:
      - "3306:3306"
    volumes:
      - ./config:/config
      - ./var/db:/var/lib/mysql

  data_analysis:
    container_name: NexusMapDataAnalysis
    build:
      context: ./app/data_analysis
      dockerfile: ../../docker/python/Dockerfile
    networks:
      - shared_network
    volumes:
      - ./app/data_analysis:/app/data_analysis
    depends_on:
      - db

  api:
    container_name: NexusMapAPI
    build:
      context: ./app/api
      dockerfile: ../../docker/php/Dockerfile
    depends_on:
      - db
    networks:
      - shared_network
    volumes:
      - ./var/projects:/userfiles
      - ./config/php:/usr/local/etc/php
      - ./app/api:/var/www/html

  frontend:
    container_name: NexusMapFront
    build:
      context: ./app/frontend
      dockerfile: ../../docker/php/Dockerfile
    volumes:
      - ./config/php:/usr/local/etc/php
      - ./app/frontend:/var/www/html
    depends_on:
      - api
    networks:
      - shared_network

  nginx:
    container_name: NexusMapProxy
    image: nginx:latest
    volumes:
      - ./nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend
    networks:
      - shared_network

networks:
  shared_network:
    name: shared_network