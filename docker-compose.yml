name: NexusMap

services:
  db:
    container_name: NexusMapDb
    image: mariadb:10.5.8
    env_file:
      - ./config/mysql.env
    environment:
      - MYSQL_ROOT_HOST=%
      - MYSQL_ROOT_PASSWORD=docker
    ports:
      - "3306:3306"
    networks:
      shared_network:
        ipv4_address: 172.23.0.102
    volumes:
      - ./config:/config
      - ./var/db:/var/lib/mysql

  data_analysis:
    container_name: NexusMapDataAnalysis
    build:
      context: ./app/data_analysis
      dockerfile: ../../docker/python/Dockerfile
    networks:
      - shared_network
    volumes:
      - ./app/data_analysis:/app/data_analysis
      - ./var/projects:/userfiles
    depends_on:
      - db

  frontend:
    container_name: NexusMapFront
    build:
      context: ./app/frontend
      dockerfile: ../../docker/php/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./config/php:/usr/local/etc/php
      - ./app/frontend:/var/www
      - ./app/frontend/public:/var/www/html
      - ./tests/:/var/www/tests
    networks:
      shared_network:
        ipv4_address: 172.23.0.101

networks:
  shared_network:
    driver: bridge
    name: shared_network
    ipam:
      config:
        - subnet: 172.23.0.0/16